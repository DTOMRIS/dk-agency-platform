name: News Ingest Pipeline

on:
  schedule:
    # Twice daily: 06:00 UTC and 14:00 UTC (10:00 and 18:00 Baku time)
    - cron: '0 6,14 * * *'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch from NewsData.io
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: npm run news:fetch

      - name: Synthesize with DeepSeek
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run news:synthesize

  notify-failure:
    runs-on: ubuntu-latest
    needs: ingest
    if: failure()
    steps:
      - name: Send failure alert
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[DK Agency] News pipeline FAILED — ${{ github.run_id }}"
          to: ${{ secrets.SMTP_USER }}
          from: DK Agency CI <${{ secrets.SMTP_USER }}>
          body: |
            News ingest pipeline failed.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Time: ${{ github.event.head_commit.timestamp || 'scheduled' }}

            Check the Actions log for details.
