name: News Ingest Pipeline

on:
  schedule:
    # Collection remains every 6h so short local feeds are not missed.
    - cron: '0 0,6,12,18 * * *'
    # AI + owner delivery at 09:00 / 18:00 Baku. GitHub may delay scheduled jobs.
    - cron: '0 5,14 * * *'
  workflow_dispatch:
    inputs:
      synthesize:
        description: 'Write/send news (shares the daily cap); otherwise collect only'
        type: boolean
        default: false

# TASK-0549 (Actions budget rule 5): never two ingests at once (a slow run must not overlap the next schedule).
concurrency:
  group: news-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch from NewsData.io
        if: github.event.schedule != '0 5,14 * * *' && !inputs.synthesize
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: npm run news:fetch

      # TASK-0480: verified trade-press RSS (Skift AI, Restaurant/Hotel Dive, Hospitality Net, Turizm Güncel,
      # Report.az/Trend titles…) → same scoring → same synthesis + Telegram approval.
      - name: Fetch trade-press RSS
        if: github.event.schedule != '0 5,14 * * *' && !inputs.synthesize
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/news-rss-fetch.ts

      - name: Synthesize with DeepSeek
        if: github.event.schedule == '0 5,14 * * *' || inputs.synthesize
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # TASK-0477: synthesized items go to the owner's Telegram for ✅/❌ approval.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run news:synthesize

  notify-failure:
    runs-on: ubuntu-latest
    needs: ingest
    if: failure()
    timeout-minutes: 5  # TASK-0504
    steps:
      - name: Send failure alert
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[DK Agency] News pipeline FAILED — ${{ github.run_id }}"
          to: ${{ secrets.SMTP_USER }}
          from: DK Agency CI <${{ secrets.SMTP_USER }}>
          body: |
            News ingest pipeline failed.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Time: ${{ github.event.head_commit.timestamp || 'scheduled' }}

            Check the Actions log for details.
